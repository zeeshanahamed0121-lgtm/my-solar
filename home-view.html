<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Home View</title><style>:root{--bg:#eaf3ff;--text:#1f2937;--muted:#8a97a8;--green:#45dca0;--cyan:#58d5e8;--orange:#ff8a00;--card:#ffffffd9;--line:#aab7c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#dfeeff 0%,#f7fbff 58%,#eef5ff 100%);font-family:Inter,system-ui,Segoe UI,Arial;color:var(--text)}.phone{max-width:460px;margin:auto;min-height:100vh;padding:18px 14px 96px;position:relative}.top{display:flex;align-items:center;justify-content:space-between}.back,.menu{font-size:32px;color:#253041}.title{text-align:center}.title h1{font-size:28px;line-height:1;margin:8px 0 4px;font-weight:500}.title small{color:#69778a}.statusRow{display:flex;gap:12px;align-items:center;margin-top:28px}.online{background:#48d52c;color:white;border-radius:18px;padding:8px 18px;font-weight:900;font-size:20px}.weather{display:flex;gap:10px;align-items:center;color:#303a48;font-size:21px}.actions{margin-left:auto;display:flex;gap:12px}.round{width:54px;height:54px;border-radius:50%;border:1px solid #d3dfeb;background:#ffffff88;display:grid;place-items:center;font-size:24px}.scene{position:relative;height:640px;margin-top:10px}.metric{position:absolute;color:#293241}.metric .label{color:#7f8c9c;font-size:25px;font-weight:300}.metric .num{font-size:42px;font-weight:800;letter-spacing:-1px}.metric .unit{font-size:18px;color:#a1aab6}.pvM{left:0;top:68px}.loadM{right:128px;top:68px}.batM{left:190px;bottom:70px}.gridM{right:12px;bottom:70px}.vbar{border-left:2px solid #748397;height:78px;position:absolute}.dash{position:absolute;border-top:2px dashed #aab3c0}.pvLine1{left:0;top:138px}.pvDash{left:2px;top:138px;width:135px}.loadLine1{left:170px;top:138px}.loadDash{left:172px;top:138px;width:135px}.batLine1{left:182px;bottom:130px}.gridLine1{right:100px;bottom:130px}.houseWrap{position:absolute;left:12px;right:12px;top:190px;height:315px;filter:drop-shadow(0 24px 28px #91a4bd55)}.house{position:absolute;left:20px;right:20px;bottom:10px;height:210px;background:#f8fbff;border:1px solid #d8e2ee;border-radius:6px;transform:skewY(-2deg)}.roof{position:absolute;left:46px;right:28px;top:48px;height:115px;background:linear-gradient(135deg,#8798ad,#51667e);clip-path:polygon(0 45%,45% 0,100% 42%,91% 58%,46% 20%,6% 60%)}.solar{position:absolute;left:132px;top:78px;width:186px;height:90px;background:repeating-linear-gradient(90deg,#647993 0 2px,transparent 2px 34px),repeating-linear-gradient(0deg,#7890aa 0 2px,transparent 2px 28px),#526981;transform:skewX(-20deg) rotate(1deg);border:2px solid #d8e2ee}.door{position:absolute;left:74px;bottom:10px;width:42px;height:96px;background:#eef5fb;border:3px solid #bcc9d8;border-radius:20px 20px 2px 2px}.win{position:absolute;width:38px;height:72px;background:#fff8df;border:4px solid #aab7c7;border-radius:22px 22px 4px 4px;box-shadow:inset 0 0 0 3px #e7edf5}.w1{left:180px;bottom:76px}.w2{left:236px;bottom:76px}.garage{position:absolute;right:0;bottom:10px;width:104px;height:88px;background:#edf3fa;border:1px solid #d1dbe8}.garage:after{content:"";position:absolute;left:14px;right:14px;bottom:10px;height:54px;border-radius:4px;background:repeating-linear-gradient(0deg,#b8c5d3 0 3px,#d8e0ea 3px 8px)}.invBox{position:absolute;left:224px;top:178px;width:52px;height:84px;background:#fff;border:1px solid #d7e0eb;border-radius:8px;box-shadow:0 8px 18px #9baabd55}.invBox:before{content:"☀️";position:absolute;left:12px;top:12px}.batteryBox{position:absolute;left:146px;bottom:8px;width:64px;height:86px;background:#f9fbff;border:1px solid #d8e2ef;border-radius:10px}.batteryBox:after{content:"";position:absolute;left:28px;top:20px;width:6px;height:44px;background:#61d4e5;border-radius:8px}.gridBox{position:absolute;right:120px;bottom:48px;width:44px;height:54px;background:#fff;border:1px solid #d8e2ef;border-radius:7px}.statePill{display:inline-block;border:2px solid var(--green);color:#35c891;border-radius:12px;padding:7px 12px;margin-top:5px;font-size:20px}.cyanPill{border-color:#75dce8;color:#67cfdf}.update{text-align:center;color:#99a3b1;font-size:20px;margin-top:-35px}.batteryCard{background:var(--card);border-radius:24px;margin-top:18px;padding:22px;box-shadow:0 16px 30px #b9c9da55}.cardHead{display:flex;justify-content:space-between;align-items:center}.cardHead h2{margin:0;font-size:27px}.batteryInner{margin-top:24px;background:#f9fbff;border-radius:20px;padding:24px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 0 30px #e9eef7}.powerPill{background:var(--green);color:white;border-radius:10px;padding:12px 14px;font-size:24px;font-weight:700}.powerPill span{background:white;color:#22b979;border:2px solid var(--green);border-radius:0 10px 10px 0;padding:10px 12px;margin-left:6px}.soc{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--soc)*1%),#e7ebf0 0)}.soc div{width:78px;height:78px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;color:#4bd49d}.tabs{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(430px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);background:white;border-radius:28px;padding:8px;box-shadow:0 18px 35px #aebed055}.tab{border:0;background:transparent;border-radius:22px;padding:13px 4px;font-size:16px;color:#666}.tab.active{background:var(--orange);color:white}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:12px;padding:10px 14px;display:none;z-index:10}.toast.show{display:block}@media(max-width:430px){.scene{height:600px}.metric .num{font-size:36px}.metric .label{font-size:22px}.houseWrap{transform:scale(.9);transform-origin:center}.batM{left:160px}.loadM{right:104px}.batteryInner{padding:18px}.powerPill{font-size:20px}.powerPill span{display:inline-block;margin-top:8px}}</style></head><body><div id="toast" class="toast"></div><main class="phone"><div class="top"><div class="back">‹</div><div class="title"><h1>Smart Solar</h1><small>ID: inverter01</small></div><div class="menu">☰</div></div><div class="statusRow"><div id="online" class="online">Online</div><div class="weather">☁️ <span>25/37°C</span></div><div class="actions"><div class="round">⏱</div><div class="round">⌘</div></div></div><section class="scene"><div class="metric pvM"><div class="label">PV</div><div><span id="pvKW" class="num">0</span><span class="unit"> kW</span></div></div><div class="metric loadM"><div class="label">Load</div><div><span id="loadKW" class="num">0</span><span class="unit"> kW</span></div></div><div class="vbar pvLine1"></div><div class="dash pvDash"></div><div class="vbar loadLine1"></div><div class="dash loadDash"></div><div class="houseWrap"><div class="house"></div><div class="roof"></div><div class="solar"></div><div class="door"></div><div class="win w1"></div><div class="win w2"></div><div class="garage"></div><div class="invBox"></div><div class="batteryBox"></div><div class="gridBox"></div></div><div class="metric batM"><div class="label">Battery <b id="batPercent" style="color:var(--green)">—%</b></div><div><span id="batKW" class="num">0</span><span class="unit"> kW</span></div><span id="batState" class="statePill">—</span></div><div class="metric gridM"><div class="label">Grid</div><div><span id="gridKW" class="num">0</span><span class="unit"> kW</span></div><span id="gridState" class="statePill cyanPill">—</span></div><div class="vbar batLine1"></div><div class="vbar gridLine1"></div></section><div id="updated" class="update">Last Update: —</div><section class="batteryCard"><div class="cardHead"><h2>Battery</h2><div>›</div></div><div class="batteryInner"><div id="batPowerPill" class="powerPill">⚡ — kW <span>—</span></div><div id="socRing" class="soc" style="--soc:0"><div><span id="socText">—%</span><br>SOC</div></div></div></section></main><nav class="tabs"><button class="tab active">Overview</button><button class="tab" onclick="location.href='./?v=full-modern-theme1'">Device</button><button class="tab" onclick="location.href='./?v=full-modern-theme1'">Alarm</button><button class="tab" onclick="location.href='./?v=full-modern-theme1'">Settings</button></nav><script>const BASE='https://smart-inverter-dbb6a-default-rtdb.asia-southeast1.firebasedatabase.app';const $=id=>document.getElementById(id);function n(v){return Number(v||0)}function kw(w){return (n(w)/1000).toFixed(n(w)>=1000?2:3).replace(/\.000$/,'')}function set(id,v){$(id).textContent=v}function update(d){let pv=n(d.pvW),load=n(d.loadW),grid=n(d.gridW),bv=n(d.batteryV),ba=n(d.batteryA),soc=n(d.batteryPercent),batW=bv*ba;set('pvKW',kw(pv));set('loadKW',kw(load));set('gridKW',kw(grid));set('batKW',kw(Math.abs(batW)));set('batPercent',Math.round(soc)+'%');set('socText',Math.round(soc)+'%');$('socRing').style.setProperty('--soc',Math.max(0,Math.min(100,soc)));let bs=ba>0.3?'Charging':ba<-0.3?'Discharging':'Idle';set('batState',bs);set('gridState',grid>10?'Importing':'Idle');$('batPowerPill').innerHTML='⚡ '+kw(Math.abs(batW))+' kW <span>'+bs+'</span>';let ts=d.ts?new Date(d.ts*1000):new Date();set('updated','Last Update: '+ts.toLocaleString());$('online').textContent=d.raw?'Online':'Offline'}async function load(){try{let r=await fetch(BASE+'/devices/inverter01.json?t='+Date.now());update(await r.json()||{})}catch(e){$('online').textContent='Offline'}}load();setInterval(load,3000);</script></body></html>
