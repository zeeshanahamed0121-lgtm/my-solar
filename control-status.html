<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inverter Controls</title><style>:root{--bg:#050914;--card:#0d1728;--line:#20314d;--txt:#eef6ff;--mut:#8da0bb;--green:#28e36f;--red:#ff4d5e;--blue:#1f7aff;--yellow:#ffb020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173b69,#050914 48%,#02040a);color:var(--txt);font-family:system-ui,Segoe UI,Arial}.wrap{max-width:980px;margin:auto;padding:18px}a{color:#93c5fd;text-decoration:none;font-weight:900}h1{margin:10px 0 4px;font-size:28px}small{color:var(--mut)}.card{background:linear-gradient(180deg,#10203aee,#091426ee);border:1px solid var(--line);border-radius:24px;padding:16px;margin:14px 0;box-shadow:0 16px 40px #0006}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(145deg,#07101f,#101e33)}.tile:before{content:"";position:absolute;right:-35px;bottom:-55px;width:140px;height:140px;border-radius:50%;background:#64748b22}.tile.on{border-color:#28e36f88;box-shadow:0 0 26px #28e36f22}.tile.off{border-color:#ff4d5e88;box-shadow:0 0 26px #ff4d5e22}.icon{font-size:40px}.label{margin-top:8px;color:var(--mut);font-weight:900;font-size:12px;letter-spacing:.8px}.state{font-size:34px;font-weight:950}.on .state{color:var(--green)}.off .state{color:var(--red)}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.btn{border:0;border-radius:16px;padding:14px;color:white;background:var(--blue);font-weight:950;cursor:pointer}.btn.red{background:linear-gradient(135deg,#ef4444,#991b1b)}.btn.warn{background:linear-gradient(135deg,#ffb020,#a16207)}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #263653;padding:12px 0}.row:last-child{border-bottom:0}.row span{color:var(--mut)}.raw{word-break:break-word;background:#07101f;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0b1424;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:900;display:none}.toast.show{display:block}@media(max-width:650px){.grid,.btns{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div id="toast" class="toast"></div><div class="wrap"><a href="./?v=status-qflag1">← Back to main dashboard</a><h1>🎛️ Modern Control Status</h1><small>Buzzer aur LCD status QFLAG se confirm hota hai</small><div class="card"><div class="grid"><div id="buzzerTile" class="tile"><div class="icon">🔊</div><div class="label">BUZZER</div><div id="buzzerState" class="state">—</div></div><div id="lcdTile" class="tile"><div class="icon">💡</div><div class="label">LCD BACKLIGHT</div><div id="lcdState" class="state">—</div></div></div><button class="btn warn" style="width:100%;margin-top:14px" onclick="sendCmd('QFLAG')">Check Status</button><div class="raw"><small>Last QFLAG</small><br><b id="qflagState">—</b></div></div><div class="card"><h2>Quick Controls</h2><div class="btns"><button class="btn" onclick="sendCmd('PEa')">Buzzer ON</button><button class="btn red" onclick="sendCmd('PDa')">Buzzer OFF</button><button class="btn" onclick="sendCmd('PEx')">LCD ON</button><button class="btn red" onclick="sendCmd('PDx')">LCD OFF</button></div></div><div class="card"><h2>Command Response</h2><div class="row"><span>Last Command</span><b id="lastCmd">—</b></div><div class="row"><span>Response</span><b id="cmdResp">—</b></div><div class="raw"><small>Raw Response</small><br><b id="cmdRespRaw">—</b></div></div></div><script>const BASE='https://smart-inverter-dbb6a-default-rtdb.asia-southeast1.firebasedatabase.app';const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2200)}function clean(s){return String(s||'').split(':')[0].replace(/[() ]/g,'')}function setTile(id,state){let e=$(id);e.className='tile '+(state==='ON'?'on':state==='OFF'?'off':'')}function parseQflag(raw){let q=clean(raw),e=q.indexOf('E'),d=q.indexOf('D');if(e<0||d<0)return null;let en=q.slice(e+1,d),dis=q.slice(d+1);return{raw:q,buzzer:en.includes('a')?'ON':dis.includes('a')?'OFF':'Unknown',lcd:en.includes('x')?'ON':dis.includes('x')?'OFF':'Unknown'}}function update(d){$('lastCmd').textContent=d.lastCmd||'—';$('cmdResp').textContent=d.cmdResp||'—';$('cmdRespRaw').textContent=d.cmdRespRaw||'—';let q=null;if(d.lastCmd==='QFLAG')q=parseQflag(d.cmdRespRaw);if(q){$('qflagState').textContent=q.raw;$('buzzerState').textContent=q.buzzer;$('lcdState').textContent=q.lcd;setTile('buzzerTile',q.buzzer);setTile('lcdTile',q.lcd)}else{$('qflagState').textContent='Press Check Status';if(d.lastCmd==='PEa'){$('buzzerState').textContent='ON';setTile('buzzerTile','ON')}if(d.lastCmd==='PDa'){$('buzzerState').textContent='OFF';setTile('buzzerTile','OFF')}if(d.lastCmd==='PEx'){$('lcdState').textContent='ON';setTile('lcdTile','ON')}if(d.lastCmd==='PDx'){$('lcdState').textContent='OFF';setTile('lcdTile','OFF')}}}async function load(){try{let r=await fetch(BASE+'/devices/inverter01.json?t='+Date.now());update(await r.json()||{})}catch(e){}}async function sendCmd(c){await fetch(BASE+'/devices/inverter01/cmd.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});toast('Command sent: '+c);setTimeout(load,1500)}load();setInterval(load,3000);</script></body></html>
