<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inverter Live Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --solar: #38bdf8;
            --load: #fbbf24;
            --battery: #4ade80;
            --text: #c9d1d9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 1100px; margin: auto; }

        /* Header & Status */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }

        .status-dot {
            height: 10px; width: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .online .status-dot { background-color: #4ade80; box-shadow: 0 0 8px #4ade80; }

        /* Metrics Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            border-bottom: 4px solid #30363d;
            text-align: center;
            position: relative;
        }

        .card h3 { font-size: 0.75rem; margin: 0; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; }
        .card .value { font-family: 'Orbitron', sans-serif; font-size: 2rem; margin: 10px 0; font-weight: 700; }
        .card .sub { font-size: 0.85rem; color: #8b949e; }

        /* Charts */
        .chart-box {
            background: var(--card);
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }

        /* Buttons */
        .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-reset { background: #238636; color: white; }
        .btn-clear { background: #da3633; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .card .value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="header-status">
        <h2 style="margin:0; font-size: 1.2rem;">⚡ Inverter01 Live</h2>
        <div id="connection-status">
            <span class="status-dot"></span> <span id="status-text">Connecting...</span>
        </div>
    </div>

    <div class="grid">
        <div class="card" style="border-color: var(--solar);">
            <h3>Solar Power</h3>
            <div class="value" id="pvW" style="color: var(--solar);">0W</div>
            <div class="sub" id="pvDetail">0V | 0A</div>
        </div>

        <div class="card" style="border-color: var(--load);">
            <h3>House Load</h3>
            <div class="value" id="loadW" style="color: var(--load);">0W</div>
            <div class="sub" id="loadPercent">0% Usage</div>
        </div>

        <div class="card" style="border-color: var(--battery);">
            <h3>Battery</h3>
            <div class="value" id="batteryV" style="color: var(--battery);">0.0V</div>
            <div class="sub" id="batteryPercent">0% Charge</div>
        </div>

        <div class="card" style="border-color: #f472b6;">
            <h3>Today's Yield</h3>
            <div class="value" id="pvkWh" style="color: #f472b6;">0.00</div>
            <div class="sub">Total kWh</div>
        </div>
    </div>

    <div class="chart-box">
        <div id="mainChart"></div>
    </div>

    <div class="actions">
        <button class="btn btn-reset" onclick="handleCmd('RESET_ENERGY')">Reset Energy</button>
        <button class="btn btn-clear" onclick="handleCmd('CLEAR_HISTORY')">Format History</button>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyA0sHa0fI8K8_jSzyORXPEdKKDIM1HbCaU",
        databaseURL: "https://smart-inverter-dbb6a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "smart-inverter-dbb6a",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const devicePath = "devices/inverter01";

    // --- CHART CONFIG ---
    const chartOptions = {
        series: [
            { name: 'Solar (W)', data: [] },
            { name: 'Load (W)', data: [] }
        ],
        chart: { 
            type: 'area', 
            height: 350, 
            toolbar: { show: false },
            foreColor: '#8b949e',
            background: 'transparent'
        },
        colors: ['#38bdf8', '#fbbf24'],
        stroke: { curve: 'smooth', width: 2 },
        fill: { type: 'gradient', gradient: { opacityFrom: 0.4, opacityTo: 0 } },
        xaxis: { type: 'datetime' },
        grid: { borderColor: '#30363d' },
        theme: { mode: 'dark' }
    };
    const chart = new ApexCharts(document.querySelector("#mainChart"), chartOptions);
    chart.render();

    // --- DATA HANDLING ---
    db.ref(devicePath).on('value', (snapshot) => {
        const d = snapshot.val();
        if (!d) return;

        // Update Text
        document.getElementById('pvW').innerText = Math.round(d.pvW) + "W";
        document.getElementById('pvDetail').innerText = d.pvV + "V | " + d.pvA + "A";
        document.getElementById('loadW').innerText = Math.round(d.loadW) + "W";
        document.getElementById('loadPercent').innerText = "Load: " + d.loadPercent + "%";
        document.getElementById('batteryV').innerText = d.batteryV.toFixed(1) + "V";
        document.getElementById('batteryPercent').innerText = d.batteryPercent + "% Capacity";
        document.getElementById('pvkWh').innerText = d.pvkWh.toFixed(2);

        // Update Online Status
        const header = document.getElementById('header-status');
        header.className = "header online";
        document.getElementById('status-text').innerText = "Live Syncing";
    });

    // --- HISTORY HANDLING ---
    db.ref(devicePath + "/history").limitToLast(100).on('value', (snapshot) => {
        let pvPoints = [];
        let loadPoints = [];
        snapshot.forEach((child) => {
            const v = child.val();
            const ts = v.ts * 1000;
            pvPoints.push([ts, v.pvW]);
            loadPoints.push([ts, v.loadW]);
        });
        chart.updateSeries([
            { name: 'Solar (W)', data: pvPoints },
            { name: 'Load (W)', data: loadPoints }
        ]);
    });

    // --- COMMAND HANDLING ---
    function handleCmd(cmd) {
        if(confirm(`Confirm: ${cmd}?`)) {
            db.ref(devicePath + "/cmd").set(cmd);
            alert("Command sent to Inverter!");
        }
    }
</script>
</body>
</html>
