<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Power Monitor Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --panel: #0a0a0a; --green: #00ff88; --blue: #3d5afe; --yellow: #ffea00; --red: #ff1744; --text: #ffffff; }
        body { font-family: 'Roboto Mono', monospace; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .header { background: var(--green); color: black; padding: 10px; text-align: center; font-weight: bold; border-radius: 8px; margin-bottom: 15px; font-size: 1.2rem; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid #222; }

        /* Gauge Style */
        .gauge-box { text-align: center; position: relative; }
        .gauge-val { font-size: 2.5rem; color: var(--yellow); font-weight: bold; margin-top: 10px; }
        .gauge-label { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* Stats List */
        .stat-item { margin-bottom: 15px; }
        .stat-label { font-size: 0.7rem; color: #888; display: block; }
        .stat-val { font-size: 1.4rem; font-weight: bold; }

        /* Vertical Bars (Exactly like your image) */
        .bars-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; height: 200px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .vertical-bar { width: 100%; background: #111; border-radius: 4px; position: relative; overflow: hidden; height: 160px; border: 1px solid #333; }
        .bar-fill { position: absolute; bottom: 0; width: 100%; transition: height 0.5s ease; }
        .bar-label { font-size: 0.6rem; margin-top: 5px; color: #888; }
        .bar-top-val { font-size: 0.7rem; margin-bottom: 5px; }

        /* Buttons */
        .btn-status { padding: 8px; border-radius: 20px; font-size: 0.8rem; border: none; font-weight: bold; width: 80px; }
        .btn-on { background: var(--green); color: black; box-shadow: 0 0 10px var(--green); }
        .btn-off { background: transparent; color: var(--blue); border: 2px solid var(--blue); }

        #chart { margin-top: 20px; background: var(--panel); border-radius: 12px; padding: 10px; }
    </style>
</head>
<body>

    <div class="header">Solar Power Monitor</div>

    <div class="main-grid">
        <div class="card gauge-box">
            <div class="gauge-label">Solar Panel</div>
            <div class="gauge-val" id="pvV">0.0<span style="font-size: 1rem; color: var(--yellow);">V</span></div>
            <div id="pvW" style="color: #888;">0.00 W</div>
        </div>

        <div class="card">
            <div class="stat-item">
                <span class="stat-label">OUTSIDE</span>
                <span class="stat-val" style="color: var(--green);" id="outsideTemp">5.4 °C</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">CHARGE CURRENT</span>
                <span class="stat-val" style="color: var(--red);" id="pvA">0.00 A</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">LOAD CURRENT</span>
                <span class="stat-val" style="color: var(--blue);" id="loadA">0.00 A</span>
            </div>
        </div>
    </div>

    <div class="main-grid" style="margin-top: 10px;">
        <div class="card bars-container">
            <div class="bar-wrapper">
                <span class="bar-top-val" id="batt1V">13.98</span>
                <div class="vertical-bar"><div id="fill1" class="bar-fill" style="height: 80%; background: var(--green);"></div></div>
                <span class="bar-label">BATT 1</span>
            </div>
            <div class="bar-wrapper" style="justify-content: center; gap: 10px;">
                <button class="btn-status btn-on">ON</button>
                <button class="btn-status btn-off">OFF</button>
                <span class="bar-label">SWITCHES</span>
            </div>
            <div class="bar-wrapper">
                <span class="bar-top-val" id="batt2V">12.2</span>
                <div class="vertical-bar"><div id="fill2" class="bar-fill" style="height: 60%; background: var(--blue); opacity: 0.6;"></div></div>
                <span class="bar-label">BATT 2</span>
            </div>
        </div>

        <div class="card">
            <div class="stat-item">
                <span class="stat-label">TEMPERATURE</span>
                <span class="stat-val" style="color: var(--green);" id="invTemp">8.3 °C</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">HUMIDITY</span>
                <span class="stat-val" style="color: var(--green);">68 %</span>
            </div>
        </div>
    </div>

    <div id="chart"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA0sHa0fI8K8_jSzyORXPEdKKDIM1HbCaU",
            databaseURL: "https://smart-inverter-dbb6a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "smart-inverter-dbb6a",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Sync Data
        db.ref("devices/inverter01").on('value', (s) => {
            const d = s.val();
            if(!d) return;

            document.getElementById('pvV').childNodes[0].nodeValue = d.pvV.toFixed(1);
            document.getElementById('pvW').innerText = d.pvW + " W";
            document.getElementById('pvA').innerText = d.pvA + " A";
            document.getElementById('loadA').innerText = d.loadA || "0.00 A";
            document.getElementById('invTemp').innerText = d.invTemp + " °C";
            document.getElementById('outsideTemp').innerText = (d.invTemp - 2) + " °C";
            
            // Battery Bars
            document.getElementById('batt1V').innerText = d.batteryV.toFixed(2);
            document.getElementById('fill1').style.height = d.batteryPercent + "%";
            
            document.getElementById('batt2V').innerText = (d.batteryV - 0.5).toFixed(2);
            document.getElementById('fill2').style.height = (d.batteryPercent - 10) + "%";
        });

        // Chart Setup
        var options = {
            series: [{name: 'Battery', data: []}, {name: 'Solar', data: []}],
            chart: { height: 200, type: 'line', toolbar: {show: false}, foreColor: '#555' },
            colors: [ '#00ff88', '#ffea00'],
            stroke: { curve: 'smooth', width: 2 },
            xaxis: { type: 'datetime' },
            grid: { borderColor: '#111' }
        };
        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
    </script>
</body>
</html>
