\')));');h=h.replace('load();setInterval(load,3000);','async function loadDailyUnits(){try{let start=new Date();start.setHours(0,0,0,0);let startTs=Math.floor(start.getTime()/1000);let url=BASE+\'/devices/inverter01/history.json?orderBy=%22ts%22&startAt=\'+startTs+\'&t=\'+Date.now();let r=await fetch(url);let hist=await r.json();let arr=Object.values(hist||{}).filter(x=>x&&x.ts).sort((a,b)=>Number(a.ts)-Number(b.ts));if(arr.length<1){T(\'todayPvKwh\',\'Waiting history\');T(\'todayLoadKwh\',\'Waiting history\');return}let first=arr[0],last=arr[arr.length-1];let pv=Math.max(0,Number(last.pvkWh||0)-Number(first.pvkWh||0));let load=Math.max(0,Number(last.loadKwh||0)-Number(first.loadKwh||0));T(\'todayPvKwh\',pv.toFixed(2)+\' kWh\');T(\'todayLoadKwh\',load.toFixed(2)+\' kWh\')}catch(e){console.error(e)}}load();loadDailyUnits();setInterval(load,3000);setInterval(loadDailyUnits,60000);');document.open();document.write(h);document.close();})().catch(e=>{document.body.innerHTML='<div class="box">Load error. Refresh page.</div>';console.error(e)});</script></body></html>
