<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inverter Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #38bdf8; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border-left: 5px solid #38bdf8; text-align: center; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .card h3 { margin: 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; }
        .card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: bold; }
        
        .status-bar { display: flex; justify-content: space-between; background: #334155; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        .online { color: #4ade80; }
        .offline { color: #f87171; }
        
        .btn-reset { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-reset:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>Inverter Monitoring</h1>
    
    <div class="status-bar">
        <span>Device: <b id="device-id">inverter01</b></span>
        <span id="status">Status: <span class="offline">Connecting...</span></span>
    </div>

    <div class="grid">
        <div class="card" style="border-color: #fbbf24;">
            <h3>Solar Power</h3>
            <p id="pvW">0 W</p>
        </div>
        <div class="card" style="border-color: #38bdf8;">
            <h3>Load Power</h3>
            <p id="loadW">0 W</p>
        </div>
        <div class="card" style="border-color: #4ade80;">
            <h3>Battery</h3>
            <p id="batteryV">0 V</p>
            <small id="batteryPercent">0%</small>
        </div>
        <div class="card" style="border-color: #f472b6;">
            <h3>Grid Voltage</h3>
            <p id="acInV">0 V</p>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Solar Energy (Total)</h3>
            <p id="pvkWh">0.00 kWh</p>
        </div>
        <div class="card">
            <h3>Load Energy (Total)</h3>
            <p id="loadKwh">0.00 kWh</p>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <button class="btn-reset" onclick="sendCommand('RESET_ENERGY')">Reset Energy Units</button>
        <button class="btn-reset" style="background:#64748b" onclick="sendCommand('CLEAR_HISTORY')">Clear History</button>
    </div>
</div>

<script>
    // --- APNI CONFIGURATION YAHAN DALEIN ---
    const firebaseConfig = {
        apiKey: "AIzaSyA0sHa0fI8K8_jSzyORXPEdKKDIM1HbCaU",
        databaseURL: "https://smart-inverter-dbb6a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "smart-inverter-dbb6a",
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const devicePath = "/devices/inverter01";

    // Data Listeners
    db.ref(devicePath).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('pvW').innerText = data.pvW + " W";
            document.getElementById('loadW').innerText = data.loadW + " W";
            document.getElementById('batteryV').innerText = data.batteryV + " V";
            document.getElementById('batteryPercent').innerText = data.batteryPercent + "%";
            document.getElementById('acInV').innerText = data.acInV + " V";
            document.getElementById('pvkWh').innerText = data.pvkWh.toFixed(2) + " kWh";
            document.getElementById('loadKwh').innerText = data.loadKwh.toFixed(2) + " kWh";
            
            // Online Status Check (last 30 seconds)
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = 'Status: <span class="online">Online</span>';
        }
    });

    // Send Command to ESP8266
    function sendCommand(cmd) {
        if(confirm("Are you sure you want to send: " + cmd + "?")) {
            db.ref(devicePath + "/cmd").set(cmd);
            alert("Command sent! Waiting for ESP8266...");
        }
    }
</script>

</body>
</html>
